name: paper

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build JOSS draft artifacts
        uses: xuanxu/publishing-artifacts-action@e2ccab79086a24d16f39868f30aa4cfe0e331be1
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            paper/paper.pdf
            paper/paper.jats
          if-no-files-found: error
