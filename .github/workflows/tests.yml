name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check credential patterns
        shell: python
        run: |
          import pathlib, re, sys
          pattern = re.compile(rb"sk-[A-Za-z0-9_-]{16,}")
          ignored = {".git", "runs", "build", "dist", "__pycache__"}
          findings = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ignored.intersection(path.parts):
                  continue
              try:
                  if pattern.search(path.read_bytes()): findings.append(str(path))
              except OSError:
                  pass
          if findings:
              print("Potential credentials in: " + ", ".join(findings))
              sys.exit(1)
